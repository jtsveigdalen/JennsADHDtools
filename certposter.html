<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MS Cert. Matrix</title>
    <style>
      /* ============================================================
         ## 🦄 VISUAL THEME / TOKENS
         ============================================================ */
      :root {
        --BG:          #f6f5f2;
        --BG_TOP:      #fbfaf7;
        --PANEL:       #ffffff;
        --INK:         #1b1b1b;
        --MUTED:       #6b6b6b;
        --GRIDLINE:    rgba(0, 0, 0, 0.08);
        --SHADOW:      0 10px 25px rgba(0, 0, 0, 0.08);
        --ROWHEAD_INK: #3b3b3b;
        --PILL_INK:    #3f3f3f;
        --RADIUS_LG:   18px;
        --RADIUS_MD:   12px;

        /* ============================================================
           ## 🎨 PREFIX / COLOR MAPPING
           ============================================================ */
        --C_AZURE:    #2b6cff; /* AZ + DP  => BLUE     */
        --C_AI:       #ff2fb3; /* AI + AB  => MAGENTA  */
        --C_SC:       #7a4bd1; /* SC       => PURPLE   */
        --C_POWER:    #ff7a1a; /* PL       => ORANGE   */
        --C_GITHUB:   #d6a400; /* GH       => GOLD     */
        --C_MS:       #1a8f4e; /* MS/MB/MD => GREEN    */
        --C_BUSINESS: #111111; /* MS BUS   => BLACK    */
        --C_NEUTRAL:  #111111; /* FALLBACK             */
      }

      :root[data-theme="darker"] {
        --BG:          #2b313b;
        --BG_TOP:      #3a4350;
        --PANEL:       #313947;
        --INK:         #eef3fa;
        --MUTED:       #c7d2e0;
        --GRIDLINE:    rgba(255, 255, 255, 0.16);
        --SHADOW:      0 10px 25px rgba(0, 0, 0, 0.35);
        --ROWHEAD_INK: #d6e0ec;
        --PILL_INK:    #d6e0ec;
        --C_NEUTRAL:   #dce6f4;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI,
                     Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--INK);
        background: linear-gradient(var(--BG_TOP), var(--BG));
      }

      :root[data-theme="darker"] .FILTERS,
      :root[data-theme="darker"] .BOARD,
      :root[data-theme="darker"] .COLHEAD,
      :root[data-theme="darker"] .ROWHEAD,
      :root[data-theme="darker"] .CELL,
      :root[data-theme="darker"] .CARD  { background: rgba(18, 23, 31, 0.74); }

      :root[data-theme="darker"] .SEARCH,
      :root[data-theme="darker"] .CHIP,
      :root[data-theme="darker"] .BTN,
      :root[data-theme="darker"] .PILL,
      :root[data-theme="darker"] .SEARCH input {
        color:      var(--INK);
        background: rgba(31, 37, 47, 0.88);
      }

      /* ============================================================
         ## 🧩 LAYOUT SHELL
         ============================================================ */
      .WRAP { max-width: 1200px; margin: 24px auto 40px; padding: 0 18px; }

      header {
        display: flex;
        gap: 16px;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .TITLEBLOCK h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
      .TITLEBLOCK p  { margin: 6px 0 0; color: var(--MUTED); max-width: 90ch; line-height: 1.35; }

      /* ============================================================
         ## 🧩 FILTER BAR
         ============================================================ */
      .FILTERS {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
        background: rgba(255, 255, 255, 0.65);
        border: 1px solid var(--GRIDLINE);
        border-radius: var(--RADIUS_LG);
        padding: 10px 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      }
      .FILTERS .GROUP {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding-right: 10px;
        border-right: 1px solid var(--GRIDLINE);
      }
      .FILTERS .GROUP:last-child { border-right: none; padding-right: 0; }
      .FILTERS label { font-size: 12px; color: var(--MUTED); margin-right: 2px; }

      .CHIP {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid var(--GRIDLINE);
        border-radius: 999px;
        background: var(--PANEL);
        cursor: pointer;
        user-select: none;
        font-size: 13px;
      }
      .CHIP input { margin: 0; }

      .SEARCH {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid var(--GRIDLINE);
        border-radius: 999px;
        background: var(--PANEL);
        min-width: 260px;
      }
      .SEARCH input { border: none; outline: none; width: 100%; font-size: 13px; background: transparent; }

      .BTN {
        border: 1px solid var(--GRIDLINE);
        background: var(--PANEL);
        border-radius: 999px;
        padding: 7px 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
      }
      .BTN:hover { filter: brightness(0.98); }
      .BTN.PRIMARY { border-color: rgba(0, 0, 0, 0.16); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06); }

      /* ============================================================
         ## 🧱 BOARD + MATRIX
         ============================================================ */
      .BOARD {
        margin-top: 14px;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid var(--GRIDLINE);
        border-radius: var(--RADIUS_LG);
        padding: 14px;
        box-shadow: var(--SHADOW);
      }

      .MATRIX { display: grid; gap: 10px; align-items: stretch; }

      .COLHEAD {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid var(--GRIDLINE);
        border-radius: var(--RADIUS_MD);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        letter-spacing: -0.01em;
        padding: 10px 8px;
        text-align: center;
      }

      .ROWHEAD {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid var(--GRIDLINE);
        border-radius: var(--RADIUS_MD);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 6px;
        overflow: hidden;
      }
      .ROWHEAD span {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-weight: 800;
        letter-spacing: 0.03em;
        font-size: 12px;
        color: var(--ROWHEAD_INK);
      }

      .CELL {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--GRIDLINE);
        border-radius: var(--RADIUS_MD);
        padding: 10px;
      }

      .CARDS {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
      }

      /* ============================================================
         ## 🧾 CARD TILE
         ============================================================ */
      .CARD {
        border: 1px solid var(--GRIDLINE);
        border-radius: 12px;
        background: var(--PANEL);
        overflow: hidden;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
        transition: transform 0.08s ease, box-shadow 0.08s ease;
      }
      .CARD:hover { transform: translateY(-1px); box-shadow: 0 12px 25px rgba(0, 0, 0, 0.09); }
      .CARD .BODY  { padding: 10px 10px 8px; min-height: 72px; }
      .CARD .TITLE { font-size: 13px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }

      .META { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; align-items: center; color: var(--MUTED); }

      .PILL {
        border: 1px solid var(--GRIDLINE);
        border-radius: 999px;
        padding: 2px 8px;
        background: rgba(0, 0, 0, 0.03);
        color: var(--PILL_INK);
        display: inline-flex;
        gap: 4px;
        align-items: center;
        font-variant-numeric: tabular-nums;
      }

      /* CODE pill: highlight prefix */
      .PREFIX                      { font-weight: 900; padding-right: 2px; }
      .PREFIX.az, .PREFIX.dp       { color: var(--C_AZURE);  }
      .PREFIX.ai, .PREFIX.ab       { color: var(--C_AI);     }
      .PREFIX.sc                   { color: var(--C_SC);     }
      .PREFIX.pl                   { color: var(--C_POWER);  }
      .PREFIX.gh                   { color: var(--C_GITHUB); }
      .PREFIX.ms, .PREFIX.mb,
      .PREFIX.md                   { color: var(--C_MS);     }

      /* footer bar */
      .BAR          { height: 12px; background: var(--C_NEUTRAL); }
      .BAR.azure    { background: var(--C_AZURE);    }
      .BAR.ai       { background: var(--C_AI);       }
      .BAR.sc       { background: var(--C_SC);       }
      .BAR.power    { background: var(--C_POWER);    }
      .BAR.github   { background: var(--C_GITHUB);   }
      .BAR.ms       { background: var(--C_MS);       }
      .BAR.business { background: var(--C_BUSINESS); }

      @media (max-width: 860px) {
        .ROWHEAD span { writing-mode: horizontal-tb; transform: none; font-size: 13px; }
        .COLHEAD      { justify-content: flex-start; padding-left: 12px; }
      }
    </style>
  </head>

      /* ============================================================

      /* ============================================================
         ## 🎨 THEME
         ============================================================ */
      const APPLY_THEME = (THEME) => {
        const USE_DARKER = THEME === "darker";

          : document.documentElement.removeAttribute("data-theme");
        if (BTN_DARKER) BTN_DARKER.textContent = USE_DARKER ? "LIGHTER MODE" : "DARKER MODE";

      };

      const TOGGLE_THEME = () => {
        const IS_DARKER = document.documentElement.getAttribute("data-theme") === "darker";
        APPLY_THEME(IS_DARKER ? "light" : "darker");
      };

      /* ============================================================
         ## 🔧 HELPERS
         ============================================================ */
      const GET_CHECKED_VALUES = (NAME) =>
        [...FILTERS_EL.querySelectorAll(`input[name="${NAME}"]:checked`)].map((X) => X.value);

      const GET_PREFIX = (CODE) => (CODE.split("-")[0] || "").toUpperCase();

      const IS_PREFIX_ALLOWED = (CODE, ALLOWED_GROUPS) => {
        /* Empty = no restriction — all prefixes pass */
        if (!ALLOWED_GROUPS.length) return true;
        const PREFIX = GET_PREFIX(CODE);
        for (const GROUP_KEY of ALLOWED_GROUPS) {
          if ((PREFIX_GROUPS[GROUP_KEY] || []).includes(PREFIX)) return true;
        }
        return false;
      };

      const BAR_CLASS_FOR_EXAM = (EXAM) => {
        if ((EXAM.FAMILY || "").toUpperCase() === "MS BUS") return "business";
        const P = GET_PREFIX(EXAM.CODE).toLowerCase();
        if (P === "sc")                          return "sc";
        if (P === "ai" || P === "ab")            return "ai";
        if (P === "pl")                          return "power";
        if (P === "gh")                          return "github";
        if (P === "az" || P === "dp")            return "azure";
        if (P === "ms" || P === "mb" || P === "md") return "ms";
        return "";
      };

      const CODE_PILL_HTML = (CODE) => {
        const PREFIX = GET_PREFIX(CODE);
        const NUM    = CODE.split("-")[1] || "";
        const CLS    = PREFIX.toLowerCase();
        return `<span class="PILL"><span class="PREFIX ${CLS}">${PREFIX}</span><span>-</span><span>${NUM}</span></span>`;
      };

      const ESC = (S) =>
        String(S || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");

      /* ============================================================
         ## 🧱 MATRIX BUILD
         FIX: cellMap is built from the in-memory element BEFORE it
         touches the DOM, eliminating the querySelectorAll race.
         ============================================================ */
      const BUILD_AND_POPULATE = (TRACK_KEYS, LEVEL_KEYS, ALLOWED_PREFIX_GROUPS, QUERY) => {

        const Q = (QUERY || "").trim().toLowerCase();

        /* 1. Build grid element in memory */
        const MATRIX_EL = document.createElement("div");
        MATRIX_EL.className = "MATRIX";
        MATRIX_EL.style.gridTemplateColumns = `96px repeat(${TRACK_KEYS.length}, 1fr)`;
        MATRIX_EL.style.gridTemplateRows    = `auto repeat(${LEVEL_KEYS.length}, auto)`;

        /* corner cell */
        MATRIX_EL.appendChild(document.createElement("div"));

        /* column headers */
        for (const TRACK of TRACK_KEYS) {
          const H = document.createElement("div");
          H.className   = "COLHEAD";
          H.textContent = TRACK_LABELS[TRACK] || TRACK;
          MATRIX_EL.appendChild(H);
        }

        /* 2. Build cellMap while creating rows — no DOM query needed */
        const CELL_MAP = new Map();
        for (const LEVEL of LEVEL_KEYS) {
          const RH = document.createElement("div");
          RH.className  = "ROWHEAD";
          RH.innerHTML  = `<span>${ESC(LEVEL_LABELS[LEVEL] || LEVEL)}</span>`;
          MATRIX_EL.appendChild(RH);

          for (const TRACK of TRACK_KEYS) {
            const CELL  = document.createElement("div");
            CELL.className = "CELL";
            const CARDS = document.createElement("div");
            CARDS.className = "CARDS";
            CELL.appendChild(CARDS);
            MATRIX_EL.appendChild(CELL);
            CELL_MAP.set(`${LEVEL}|${TRACK}`, CARDS);
          }
        }

        /* 3. Populate cards into in-memory containers */
        for (const EXAM of EXAMS) {
          if (TRACK_KEYS.length && !TRACK_KEYS.includes(EXAM.TRACK)) continue;
          if (LEVEL_KEYS.length && !LEVEL_KEYS.includes(EXAM.LEVEL)) continue;
          if (!IS_PREFIX_ALLOWED(EXAM.CODE, ALLOWED_PREFIX_GROUPS))  continue;
          if (Q) {
            const HAY = [EXAM.CODE, EXAM.TITLE, (EXAM.TAGS || []).join(" "), EXAM.FAMILY]
              .join(" ").toLowerCase();
            if (!HAY.includes(Q)) continue;
          }
          const TARGET = CELL_MAP.get(`${EXAM.LEVEL}|${EXAM.TRACK}`);
          if (!TARGET) continue;

          const BAR_CLASS  = BAR_CLASS_FOR_EXAM(EXAM);
          const FAMILY_PILL = `<span class="PILL">${ESC(EXAM.FAMILY || "")}</span>`;
          const TAG_PILLS   = (EXAM.TAGS || []).slice(0, 2)
            .map((T) => `<span class="PILL">${ESC(T)}</span>`).join("");

          TARGET.insertAdjacentHTML("beforeend", `
            <article class="CARD">
              <div class="BODY">
                <h3 class="TITLE">${ESC(EXAM.TITLE || EXAM.CODE)}</h3>
                <div class="META">
                  ${CODE_PILL_HTML(EXAM.CODE)}
                  ${FAMILY_PILL}
                  ${TAG_PILLS}
                </div>
              </div>
              <div class="BAR ${BAR_CLASS}"></div>
            </article>`);
        }

        /* 4. Single DOM swap — no race condition */
        MATRIX_HOST.innerHTML = "";
        MATRIX_HOST.appendChild(MATRIX_EL);
      };

      /* ============================================================
         ## ▶ APPLY ALL
         Empty checked set = no filter on that dimension (show all).
         ============================================================ */
      const APPLY_ALL = () => {
        const TRACK_KEYS           = GET_CHECKED_VALUES("TRACK");
        const LEVEL_KEYS           = GET_CHECKED_VALUES("LEVEL");
        const ALLOWED_PREFIX_GROUPS = GET_CHECKED_VALUES("PREFIX");
        const QUERY                = Q_EL.value || "";

        /* Empty group = no filter on that dimension (show all in that axis).
           UNCHECK_ALL sets a flag to force a clear board instead. */
        const SAFE_TRACKS = TRACK_KEYS.length ? TRACK_KEYS : Object.keys(TRACK_LABELS);
        const SAFE_LEVELS = LEVEL_KEYS.length ? LEVEL_KEYS : Object.keys(LEVEL_LABELS);
        if (APPLY_ALL._clearBoard) {
          APPLY_ALL._clearBoard = false;
          MATRIX_HOST.innerHTML = "";
          return;
        }

        /* DEBUG BANNER — uncomment inner block to diagnose filter state
        (function() {
          let DBG = document.getElementById("DBG");
          if (!DBG) {
            DBG = document.createElement("pre");
            DBG.id = "DBG";
            DBG.style.cssText = "background:#fffb8f;color:#333;padding:8px 12px;font-size:11px;"
                              + "border-radius:6px;margin-bottom:10px;white-space:pre-wrap;border:1px solid #cca";
            MATRIX_HOST.parentElement.insertBefore(DBG, MATRIX_HOST);
          }
          DBG.textContent = "TRACKS: ["  + (TRACK_KEYS.join(", ")            || "none") + "]\n"
                          + "LEVELS: ["  + (LEVEL_KEYS.join(", ")            || "none") + "]\n"
                          + "PREFIX: ["  + (ALLOWED_PREFIX_GROUPS.join(", ") || "none") + "]\n"
                          + 'SEARCH: "' + QUERY + '"';
        })();
        */

        BUILD_AND_POPULATE(SAFE_TRACKS, SAFE_LEVELS, ALLOWED_PREFIX_GROUPS, QUERY);
      };

      /* ============================================================
         ## ↺ RESET
         ============================================================ */
      const RESET_ALL = () => {
        FILTERS_EL.querySelectorAll('input[type="checkbox"]').forEach((CB) => (CB.checked = true));
        Q_EL.value = "";
        APPLY_ALL();
      };

      /* ============================================================
         ## 🎧 EVENT LISTENERS
         ============================================================ */
      GO_BTN.addEventListener("click", APPLY_ALL);
      RESET_BTN.addEventListener("click", RESET_ALL);
      BTN_DARKER.addEventListener("click", TOGGLE_THEME);

      /* ============================================================
         ## 🦄✨🌈 CHECK ALL / UNCHECK ALL
         Check All   = tick every checkbox, re-render (same as RESET minus search clear)
         Uncheck All = clear every checkbox, re-render (empty = no filter = show everything)
         ============================================================ */
      document.getElementById("CHECK_ALL").addEventListener("click", () => {
        FILTERS_EL.querySelectorAll('input[type="checkbox"]').forEach((CB) => (CB.checked = true));
        APPLY_ALL();
      });

      document.getElementById("UNCHECK_ALL").addEventListener("click", () => {
        FILTERS_EL.querySelectorAll('input[type="checkbox"]').forEach((CB) => (CB.checked = false));
        APPLY_ALL._clearBoard = true;
        APPLY_ALL();
      });

      /* restore saved theme */
      try {
        APPLY_THEME(localStorage.getItem(THEME_KEY) === "darker" ? "darker" : "light");
      } catch {
        APPLY_THEME("light");
      }

      /* initial render */
      APPLY_ALL();
    </script>
  </body>
</html>
